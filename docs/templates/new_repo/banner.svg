<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%" role="img" aria-label="@@name@@">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0C10" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0088FF" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)" />
  <rect x="60" y="212" width="1080" height="3" fill="url(#line)" />
  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="@@font_size@@" font-weight="700" letter-spacing="2" fill="#E6EDF3">@@name@@</text>
  <text x="600" y="256" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" letter-spacing="6" fill="#00E5FF">EH3D FABRICATION SUITE</text>
</svg>
