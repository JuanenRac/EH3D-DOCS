name: Validate (reusable)

# The validation every repository of the suite runs: the manifest, versions, documentation and
# language parity (tools/ci_validate.py) and the pictures of the README. A repository calls it with
#
#   jobs:
#     validate:
#       uses: JuanenRac/EH3D-DOCS/.github/workflows/validate.yml@<tag>
#
# and adds its own jobs (cargo, npm, gradle) next to it. See docs/REUSABLE_VALIDATION.md. The optional
# inputs (isolated, os, timeout-minutes) default to what the workflow always did.

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version used for the checks"
        type: string
        default: "3.12"
      check-pictures:
        description: "Check that the Architecture and Repository Structure pictures of the README match docs/architecture.json and docs/structure.json"
        type: boolean
        default: true
      check-links:
        description: "Run tools/check_links.py (the links between the documents); needs that script in the repository"
        type: boolean
        default: false
      run-tool-tests:
        description: "Run the unit tests of tools/ (python -I -m unittest discover -s tools -p test_*.py)"
        type: boolean
        default: false
      isolated:
        description: "Run the Python checks with -I (isolated mode); false for a repository whose validator is of an older generation and needs its own folder on the path"
        type: boolean
        default: true
      os:
        description: "Runners to validate on, as a JSON list of runner labels (a list of two or more runs one job per runner)"
        type: string
        default: '["ubuntu-latest"]'
      timeout-minutes:
        description: "Minutes after which a validation job is stopped"
        type: number
        default: 15

permissions:
  contents: read

jobs:
  validate:
    # one runner keeps the name every repository already waits for; several add the runner to it
    name: ${{ strategy.job-total > 1 && format('Validate the repository ({0})', matrix.os) || 'Validate the repository' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    defaults:
      run:
        shell: bash
    env:
      PYFLAGS: ${{ inputs.isolated && '-I' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Manifest, documentation and language parity
        run: python $PYFLAGS tools/ci_validate.py
      - name: Pictures of the README
        if: ${{ inputs.check-pictures }}
        run: |
          python $PYFLAGS tools/make_architecture.py --check
          python $PYFLAGS tools/make_structure.py --check --readmes
      - name: Links between the documents
        if: ${{ inputs.check-links }}
        run: python $PYFLAGS tools/check_links.py
      - name: Tests of the repository checks
        if: ${{ inputs.run-tool-tests }}
        run: python $PYFLAGS -m unittest discover -s tools -p "test_*.py"
