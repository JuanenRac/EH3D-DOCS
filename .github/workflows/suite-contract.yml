name: EH3D suite contract

# Checks the relations between the repositories that no repository can check alone (tools/suite_contract.py). An ERROR of the check makes the run fail, so a map of the
# suite that is behind a published release turns the run red until `--write-map` brings it up to date; the warnings only go to the summary of the run.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: The repositories fit each other
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this repository next to the others
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: EH3D-DOCS
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Bring the repositories of the suite
        run: |
          # the repositories named in the map of the suite; one that is not published yet is skipped
          for name in $(grep -o '^| \[EH3D-[A-Z0-9-]*\]' EH3D-DOCS/docs/SUITE_MAP.md | grep -o 'EH3D-[A-Z0-9-]*' | sort -u); do
            [ "$name" = "EH3D-DOCS" ] && continue
            if git clone --depth 1 --quiet "https://github.com/JuanenRac/$name.git" "$name"; then
              # the tags too, or the newest release of a repository would be read as its manifest version
              git -C "$name" fetch --quiet --depth 1 --tags origin || echo "no tags for $name"
            else
              echo "not published: $name"
            fi
          done
      - name: Run the checks
        run: |
          python -I EH3D-DOCS/tools/suite_contract.py --workspace . | tee contract.txt
          { echo "### The repositories of the suite"; echo; echo '```'; cat contract.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
