name: EH3D CI baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a newer push to a branch replaces the run before it; the runs of main and of the tags are never cancelled
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # The checks every repository of the suite runs, held once in EH3D-DOCS as a reusable workflow; the reference is a full
  # commit, so a change there reaches this repository only when this line is moved.
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      python-version: "3.12"
      check-pictures: true
      check-links: true
      run-tool-tests: true

  changelog:
    name: The change has a line in the CHANGELOG
    if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The change has a line in the CHANGELOG
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python -I tools/changelog_pr_check.py --base "origin/$BASE_REF"

  registry:
    name: Registry of container codes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Registry of container codes
        run: python -I -m unittest discover -s registry -p "test_*.py"

  coverage:
    name: Coverage of the tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The tests of the tools cover at least 85 % of the code of the tools
        run: |
          python -m pip install --disable-pip-version-check coverage==7.6.10
          python -I -m coverage run --source=tools -m unittest discover -s tools -p "test_*.py"
          python -I -m coverage report --omit="tools/test_*.py" --ignore-errors --skip-empty --fail-under=85
